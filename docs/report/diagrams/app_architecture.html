<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#fff}
svg{font-family:Arial,Helvetica,sans-serif}
.t{font-size:15px;font-weight:bold;fill:#1f2937}
.s{font-size:12px;fill:#374151}
.m{font-family:Consolas,monospace;font-size:11.5px;fill:#111827}
.l{font-size:12px;font-weight:bold}
</style></head><body>
<svg width="1400" height="860" viewBox="0 0 1400 860" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
</defs>
<text x="700" y="34" text-anchor="middle" style="font-size:22px;font-weight:bold;fill:#111827">PeerWire: Application Architecture</text>
<text x="700" y="56" text-anchor="middle" class="s">Every arrow is a TCP connection to port 5000. Each connection is a separate socket identified by its 4-tuple.</text>

<!-- clients -->
<text x="40" y="100" class="l" fill="#166534">CLIENTS</text>
<g>
<rect x="30" y="112" width="300" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="180" y="138" text-anchor="middle" class="t">GUI client (Alice)</text>
<text x="180" y="160" text-anchor="middle" class="s">src/gui_client.py · Tkinter</text>
<text x="180" y="180" text-anchor="middle" class="s">thread 1: UI event loop</text>
<text x="180" y="198" text-anchor="middle" class="s">thread 2: recv_message() loop</text>
<text x="180" y="222" text-anchor="middle" class="m">local 192.168.x.a : 52184 (ephemeral)</text>
<text x="180" y="242" text-anchor="middle" class="m">4-byte length prefix + JSON</text>
</g>
<g>
<rect x="30" y="300" width="300" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="180" y="326" text-anchor="middle" class="t">Terminal client (Bob)</text>
<text x="180" y="348" text-anchor="middle" class="s">src/client.py · socket + threading</text>
<text x="180" y="366" text-anchor="middle" class="s">/msg /join /users /ping /quit /crash</text>
<text x="180" y="386" text-anchor="middle" class="s">prints its own 4-tuple on connect</text>
<text x="180" y="410" text-anchor="middle" class="m">local 192.168.x.b : 58920 (ephemeral)</text>
<text x="180" y="430" text-anchor="middle" class="m">4-byte length prefix + JSON</text>
</g>
<g>
<rect x="30" y="488" width="300" height="120" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="180" y="514" text-anchor="middle" class="t">Test &amp; demo tools</text>
<text x="180" y="536" text-anchor="middle" class="s">tests/test_chat.py · tools/framing_demo.py</text>
<text x="180" y="556" text-anchor="middle" class="s">tools/lifecycle_client.py (FIN / RST / kill)</text>
<text x="180" y="580" text-anchor="middle" class="s">send split, combined and malformed frames</text>
</g>

<!-- server process -->
<rect x="440" y="84" width="930" height="700" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/>
<text x="905" y="112" text-anchor="middle" style="font-size:17px;font-weight:bold;fill:#1d4ed8">Server process: python src/server.py  (PeerWireServer)</text>

<rect x="470" y="135" width="400" height="120" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="670" y="161" text-anchor="middle" class="t">Listening socket  0.0.0.0:5000</text>
<text x="670" y="183" text-anchor="middle" class="m">socket(AF_INET, SOCK_STREAM)</text>
<text x="670" y="201" text-anchor="middle" class="m">SO_REUSEADDR · bind() · listen(50)</text>
<text x="670" y="223" text-anchor="middle" class="s">accept loop (main thread): kernel completes</text>
<text x="670" y="240" text-anchor="middle" class="s">SYN / SYN-ACK / ACK, accept() returns new socket</text>

<rect x="470" y="290" width="400" height="230" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<text x="670" y="316" text-anchor="middle" class="t">One worker thread per connection</text>
<text x="670" y="338" text-anchor="middle" class="m">_handle_client(sock, addr)</text>
<text x="490" y="366" class="s">1. enable keepalive (60 s idle, 10 s probes)</text>
<text x="490" y="386" class="s">2. send timeout 5 s (slow readers are dropped)</text>
<text x="490" y="406" class="s">3. data = sock.recv(4096)</text>
<text x="490" y="426" class="s">4. FrameDecoder.feed(data) → complete frames</text>
<text x="490" y="446" class="s">5. parse_payload → validate → dispatch</text>
<text x="490" y="466" class="s">6. b"" = FIN · ConnectionResetError = RST</text>
<text x="490" y="486" class="s">7. finally: remove from registry, close socket</text>
<text x="490" y="506" class="s">   bad input → ERROR reply, connection stays open</text>

<rect x="910" y="135" width="430" height="185" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1125" y="161" text-anchor="middle" class="t">Client registry (in memory, RLock)</text>
<text x="1125" y="183" text-anchor="middle" class="m">clients: username → ClientSession</text>
<text x="930" y="210" class="m">'Alice' → sock, (ip, 52184), room #general</text>
<text x="930" y="230" class="m">'Bob'   → sock, (ip, 58920), room #general</text>
<text x="1125" y="260" text-anchor="middle" class="s">routes BROADCAST to everyone in the same room,</text>
<text x="1125" y="278" text-anchor="middle" class="s">DIRECT to one user, pushes USER_LIST on join/leave</text>
<text x="1125" y="300" text-anchor="middle" class="s">rooms: #general  #study-group  #announcements</text>

<rect x="910" y="350" width="430" height="170" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
<text x="1125" y="376" text-anchor="middle" class="t">Framing &amp; validation  (src/protocol.py)</text>
<text x="1125" y="400" text-anchor="middle" class="m">[ 4-byte length N, big-endian ][ N bytes UTF-8 JSON ]</text>
<text x="930" y="428" class="s">• max frame 64 KiB (larger → ERROR, connection closed)</text>
<text x="930" y="448" class="s">• username: 3-20 letters, digits, underscore; unique</text>
<text x="930" y="468" class="s">• message: 1-2000 characters after trimming</text>
<text x="930" y="488" class="s">• room: #name (lowercase, digits, - and _)</text>
<text x="930" y="508" class="s">• unknown type / wrong field type → ERROR</text>

<rect x="470" y="555" width="870" height="200" rx="10" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
<text x="905" y="580" text-anchor="middle" class="t">Message format (one frame each)</text>
<text x="490" y="606" class="m">C→S  {"type":"REGISTER","username":"Alice"}            S→C  {"type":"REGISTER_ACK",...} or {"type":"REGISTER_FAIL","reason":...}</text>
<text x="490" y="628" class="m">C→S  {"type":"BROADCAST","content":"Hi all"}             S→room {"type":"BROADCAST","sender":"Alice","room":"#general",...}</text>
<text x="490" y="650" class="m">C→S  {"type":"DIRECT","target":"Bob","content":"Hi"}     S→Bob  {"type":"DIRECT",...}  + echo to Alice (is_echo)</text>
<text x="490" y="672" class="m">C→S  {"type":"ROOM_JOIN","room":"#study-group"} · {"type":"USER_LIST"} · {"type":"PING"} · {"type":"DISCONNECT"}</text>
<text x="490" y="694" class="m">S→C  {"type":"SYSTEM","content":"-> Bob joined #general"} · {"type":"ERROR","message":"..."} · {"type":"PONG"}</text>
<text x="490" y="724" class="s">Logs: console + logs/server.log (rotating). Connect, register, disconnect reason (FIN / RST / timeout), malformed input, errors.</text>
<text x="490" y="742" class="s">Config from environment: PEERWIRE_HOST, PEERWIRE_PORT, LOG_LEVEL, LOG_FILE (see .env.example).</text>

<!-- arrows -->
<path d="M330,187 C380,187 410,195 468,195" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#o)" marker-start="url(#o)"/>
<text x="345" y="176" class="l" fill="#c2410c">TCP :5000</text>
<path d="M330,375 C390,375 400,215 468,210" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#o)" marker-start="url(#o)"/>
<text x="345" y="364" class="l" fill="#c2410c">TCP :5000</text>
<path d="M330,548 C400,548 400,230 468,225" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#o)"/>
<path d="M670,255 L670,288" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="680" y="277" class="s">new socket per client</text>
<path d="M870,400 L908,250" stroke="#374151" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M870,440 L908,440" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="700" y="815" text-anchor="middle" class="s">One server port (5000) serves every client: the OS delivers each segment to the right connected socket using (client IP, client port, server IP, 5000).</text>
</svg>
</body></html>
